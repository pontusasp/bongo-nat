<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- Body -->
  <ellipse cx="140" cy="200" rx="100" ry="70" fill="#f5e6ca" stroke="#4a3728" stroke-width="3"/>
  <!-- Head -->
  <circle cx="140" cy="110" r="65" fill="#f5e6ca" stroke="#4a3728" stroke-width="3"/>
  <!-- Left ear -->
  <polygon points="90,60 75,15 110,45" fill="#f5e6ca" stroke="#4a3728" stroke-width="3"/>
  <polygon points="92,55 82,25 107,47" fill="#f0c0a0" stroke="none"/>
  <!-- Right ear -->
  <polygon points="190,60 205,15 170,45" fill="#f5e6ca" stroke="#4a3728" stroke-width="3"/>
  <polygon points="188,55 198,25 173,47" fill="#f0c0a0" stroke="none"/>
  <!-- Left eye -->
  <ellipse cx="115" cy="105" rx="12" ry="14" fill="white" stroke="#4a3728" stroke-width="2"/>
  <ellipse cx="117" cy="107" rx="6" ry="7" fill="#4a3728"/>
  <ellipse cx="119" cy="104" rx="2" ry="2.5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="165" cy="105" rx="12" ry="14" fill="white" stroke="#4a3728" stroke-width="2"/>
  <ellipse cx="167" cy="107" rx="6" ry="7" fill="#4a3728"/>
  <ellipse cx="169" cy="104" rx="2" ry="2.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="140" cy="125" rx="5" ry="3.5" fill="#f0a0a0"/>
  <!-- Mouth -->
  <path d="M132,130 Q140,140 148,130" fill="none" stroke="#4a3728" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="70" y1="118" x2="108" y2="122" stroke="#4a3728" stroke-width="1.5"/>
  <line x1="70" y1="130" x2="108" y2="128" stroke="#4a3728" stroke-width="1.5"/>
  <line x1="172" y1="122" x2="210" y2="118" stroke="#4a3728" stroke-width="1.5"/>
  <line x1="172" y1="128" x2="210" y2="130" stroke="#4a3728" stroke-width="1.5"/>
  <!-- Left paw (resting on surface) -->
  <ellipse cx="90" cy="258" rx="25" ry="12" fill="#f5e6ca" stroke="#4a3728" stroke-width="2"/>
  <!-- Right paw (resting on surface) -->
  <ellipse cx="190" cy="258" rx="25" ry="12" fill="#f5e6ca" stroke="#4a3728" stroke-width="2"/>
  <!-- Surface line -->
  <line x1="40" y1="270" x2="240" y2="270" stroke="#4a3728" stroke-width="2"/>
</svg>
